# Throw-away PostgreSQL and MariaDB servers for the multi-database tests (data lives in tmpfs, so nothing persists).
#   docker compose -f docker-compose.test.yml up -d --wait
#   npm run test:postgres -w server     # whole suite on PostgreSQL
#   npm run test:mariadb -w server      # whole suite on MariaDB
#   npm run test:db -w server           # engine-level checks on SQLite, PostgreSQL and MariaDB
#   docker compose -f docker-compose.test.yml down
# Pin the minimum supported versions in CI as well as the latest: PostgreSQL 14+ and MariaDB 10.6+.
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: postgres }
    ports: ['55432:5432']
    tmpfs: [/var/lib/postgresql/data]
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U test'], interval: 2s, timeout: 3s, retries: 30 }
  mariadb:
    image: mariadb:11
    environment: { MARIADB_ROOT_PASSWORD: test }
    ports: ['53306:3306']
    tmpfs: [/var/lib/mysql]
    healthcheck: { test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized'], interval: 2s, timeout: 3s, retries: 30 }
